
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Profile Cards</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Our Team</h1>
        <p>Meet our talented developers</p>
    </header>

    <main class="container">

        <div class="card">
            <div class="avatar">S</div>
            <h2>Suraj Chaudhary</h2>
            <p class="role">Java Developer</p>
            <p class="description">
                Interested in Java development
                and software engineering.
            </p>
            <button>View Profile</button>
        </div>

        <div class="card">
            <div class="avatar">R</div>
            <h2>Rahul Sharma</h2>
            <p class="role">Web Developer</p>
            <p class="description">
                Interested in HTML, CSS
                and frontend development.
            </p>
            <button>View Profile</button>
        </div>

        <div class="card">
            <div class="avatar">A</div>
            <h2>Aman Verma</h2>
            <p class="role">Python Developer</p>
            <p class="description">
                Interested in Python
                and problem solving.
            </p>
            <button>View Profile</button>
        </div>

    </main>

</body>
</html>
