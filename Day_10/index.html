
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="heading">Our Products</h1>

    <div class="container">

        <div class="card">
            <div class="product-image">⌚</div>
            <h2>Smart Watch</h2>
            <p>Modern smartwatch with useful features.</p>
            <h3>₹1,999</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <div class="product-image">🎧</div>
            <h2>Headphones</h2>
            <p>Enjoy music with clear sound quality.</p>
            <h3>₹999</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <div class="product-image">📱</div>
            <h2>Smart Phone</h2>
            <p>Experience technology in your hands.</p>
            <h3>₹14,999</h3>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
